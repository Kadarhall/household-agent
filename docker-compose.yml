services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-household}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-household}
    ports:
      - "5432:5432"
    volumes:
      - household-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-household} -d ${POSTGRES_DB:-household}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  household-db:
